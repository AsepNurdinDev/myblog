# Cloudflared on the NEXUS host reaches Nginx through a loopback-published
# Docker port. Docker presents that traffic through this fixed bridge gateway.
# Only that gateway may supply Cloudflare's client-IP header.
set_real_ip_from 172.28.0.1;
real_ip_header CF-Connecting-IP;
real_ip_recursive off;

upstream php_fpm {
    server backend:9000;
}

# Resolving through Docker DNS at request time lets the stack run before the
# optional frontend profile exists. Nginx returns 503 rather than failing boot.
resolver 127.0.0.11 valid=10s ipv6=off;

map $host $frontend_upstream {
    default frontend:3000;
}

map $host $api_allowed_origin {
    default "";
    "https://asepblog.online" "https://asepblog.online";
}

server {
    listen 8080 default_server;
    server_name _;
    return 444;
}

server {
    listen 8080;
    server_name api.asepblog.online;
    root /var/www/html/public;
    index index.php;

    include /etc/nginx/conf.d/snippets/security-headers.conf;

    location = /up {
        include /etc/nginx/conf.d/snippets/fastcgi-laravel.conf;
    }

    location ^~ /api/ {
        include /etc/nginx/conf.d/snippets/fastcgi-laravel.conf;
        add_header Access-Control-Allow-Origin $api_allowed_origin always;
        add_header Vary Origin always;
    }

    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        access_log off;
        expires 7d;
    }

    location ~ /(?:\.env|\.git|composer\.(?:json|lock)|artisan|package(?:-lock)?\.json|phpunit\.xml)$ {
        deny all;
    }

    location / {
        return 404;
    }
}

server {
    listen 8080;
    server_name admin.asepblog.online;
    root /var/www/html/public;
    index index.php;

    include /etc/nginx/conf.d/snippets/security-headers.conf;

    location = / {
        return 302 /admin/;
    }

    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        access_log off;
        expires 7d;
    }

    location ~ /(?:\.env|\.git|composer\.(?:json|lock)|artisan|package(?:-lock)?\.json|phpunit\.xml)$ {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include /etc/nginx/conf.d/snippets/fastcgi-laravel.conf;
    }
}

server {
    listen 8080;
    server_name asepblog.online www.asepblog.online;

    include /etc/nginx/conf.d/snippets/security-headers.conf;

    location / {
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_intercept_errors on;
        error_page 502 503 504 = @frontend_unavailable;
    }

    location @frontend_unavailable {
        default_type text/plain;
        return 503 "Frontend is not enabled yet.\n";
    }
}
